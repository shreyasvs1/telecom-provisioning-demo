spring:
  profiles:
    active: h2   # switch to "oracle" once you have a real Oracle instance to point at

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:provisioning;MODE=Oracle;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none     # schema comes from schema.sql, not auto-generated
    show-sql: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  h2:
    console:
      enabled: true      # browse http://localhost:8080/h2-console while the app runs
      path: /h2-console

---
# Example only - fill in real values and add the ojdbc dependency back in pom.xml
# before using this profile against a real Oracle instance (e.g. Oracle XE in Docker).
spring:
  config:
    activate:
      on-profile: oracle
  datasource:
    url: jdbc:oracle:thin:@localhost:1521/XEPDB1
    driver-class-name: oracle.jdbc.OracleDriver
    username: provisioning_user
    password: change_me
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
  sql:
    init:
      mode: never   # against a real Oracle DB, run schema-oracle.sql yourself via SQL*Plus/SQLcl
